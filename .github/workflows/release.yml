# Builds installers for Windows, Linux and macOS, plus signed update packages and
# latest.json for the in-app updater, and attaches them to a draft release.
# Run it by pushing a version tag (git tag v0.1.0 && git push origin v0.1.0) or from the
# Actions tab ("Run workflow", on main only).
#
# Nothing is built until `check` has seen that the tag matches the version in Cargo.toml,
# app/package.json and tauri.conf.json, that the commit is on main, and that CI passed on it.
# The draft release is created once, by `draft`, before the three builds start; the builds only
# upload to it by id (tauri-action would otherwise create one release per job when none exists yet).
# The build job holds the updater's signing key, so every action it uses is pinned by commit.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# one release run per ref at a time: two runs for the same tag would race in `draft`
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Run from main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        run: |
          echo "::error::Release runs from main, not ${GITHUB_REF}"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: The tag matches the version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          cargo_v=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          npm_v=$(node -p "require('./app/package.json').version")
          tauri_v=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "Cargo.toml: $cargo_v, app/package.json: $npm_v, tauri.conf.json: $tauri_v"
          if [ -z "$cargo_v" ] || [ "$cargo_v" != "$npm_v" ] || [ "$cargo_v" != "$tauri_v" ]; then
            echo "::error::The three version numbers differ; see docs/06-releasing.md"
            exit 1
          fi
          if [ "$REF_TYPE" = tag ] && [ "$REF_NAME" != "v$cargo_v" ]; then
            echo "::error::Tag $REF_NAME doesn't match version $cargo_v"
            exit 1
          fi
          # a manual run has no tag: the release is named after the version, as tauri-action did
          if [ "$REF_TYPE" = tag ]; then echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"; else echo "tag=v$cargo_v" >> "$GITHUB_OUTPUT"; fi
      - name: The commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main"
            exit 1
          fi
      # CI starts on the same push as the tag, so it may still be running: wait for it
      - name: CI passed on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 1 120); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --limit 1 --json status,conclusion --jq '.[0] // {} | "\(.status) \(.conclusion)"')
            echo "CI on $GITHUB_SHA: ${run:-not started}"
            case "$run" in
              "completed success") exit 0 ;;
              completed*)
                echo "::error::CI did not pass on $GITHUB_SHA"
                exit 1
                ;;
            esac
            sleep 30
          done
          echo "::error::CI did not finish within an hour"
          exit 1

  # Creates the draft release once. The builds below run at the same time and would each create
  # their own if none existed yet. Re-running reuses the draft instead of making another.
  draft:
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Create the draft release, or reuse it
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          # drafts are listed too (with contents: write); one entry per release with this tag
          found=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | \"\(.id) \(.draft)\"")
          if [ "$(echo -n "$found" | grep -c .)" -gt 1 ]; then
            echo "::error::More than one release exists for $TAG; delete the extra drafts and re-run"
            echo "$found"
            exit 1
          fi
          if [ -n "$found" ]; then
            id=${found% *}
            if [ "${found#* }" != true ]; then
              echo "::error::$TAG is already published (release $id); not touching it"
              exit 1
            fi
            echo "Reusing the draft release $id for $TAG"
          else
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" -X POST \
              -f tag_name="$TAG" -f target_commitish="$GITHUB_SHA" -f name="Quire $TAG" \
              -f body="Installers for Windows (.msi / .exe), Linux (.AppImage / .deb / .rpm) and macOS (.dmg). These builds are not code-signed yet." \
              -F draft=true --jq .id)
            echo "Created the draft release $id for $TAG"
          fi
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, draft]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: ubuntu-22.04
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Rust (rust-toolchain.toml)
        run: rustup toolchain install

      - name: Both macOS architectures
        if: matrix.platform == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # the build below can't take --locked, so make sure Cargo.lock needs no change first
      - name: Cargo.lock is up to date
        run: cargo fetch --locked

      - name: Install front-end dependencies
        run: npm ci
        working-directory: app

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # signs the update packages; the app checks them against the public key in tauri.conf.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          # uploads to the draft made by `draft`; with a releaseId the action never creates a release
          releaseId: ${{ needs.draft.outputs.release_id }}
          # only used as the "notes" in latest.json
          releaseBody: Installers for Windows (.msi / .exe), Linux (.AppImage / .deb / .rpm) and macOS (.dmg). These builds are not code-signed yet.
          # latest.json: what the app checks for updates (only published releases count)
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # The three builds each merge their platforms into latest.json (read, delete, upload again, retried
  # on conflict). Make sure nothing was lost and that only one release exists before anyone publishes.
  verify:
    needs: [check, draft, build]
    runs-on: ubuntu-22.04
    permissions:
      # draft releases and their assets are only visible to a token that can write
      contents: write
    steps:
      - name: One release, and latest.json covers every platform
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.tag }}
          RELEASE_ID: ${{ needs.draft.outputs.release_id }}
        run: |
          n=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"$TAG\") | .id" | grep -c .)
          if [ "$n" != 1 ]; then
            echo "::error::Expected one release for $TAG, found $n"
            exit 1
          fi
          asset=$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq '.[] | select(.name == "latest.json") | .id')
          if [ -z "$asset" ]; then
            echo "::error::latest.json is missing from release $RELEASE_ID"
            exit 1
          fi
          gh api -H "Accept: application/octet-stream" "repos/$GITHUB_REPOSITORY/releases/assets/$asset" > latest.json
          jq '.platforms | keys' latest.json
          for os in windows linux darwin; do
            if ! jq -e --arg os "$os" '.platforms | keys | any(startswith($os + "-"))' latest.json > /dev/null; then
              echo "::error::latest.json has no $os entry (a concurrent upload overwrote it?); re-run the failed jobs"
              exit 1
            fi
          done
