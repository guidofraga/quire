# Asks everyone who commits to a pull request to sign the Contributor License Agreement (CLA.md)
# once, by commenting on the pull request. Signatures are stored in signatures/cla.json on the
# `cla-signatures` branch. The action never checks out the pull request's code, so running on
# pull_request_target (needed to comment on pull requests from forks) is safe.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-22.04
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/guidofraga/quire/blob/main/CLA.md
          branch: cla-signatures
          allowlist: guidofraga,dependabot[bot]
