# Engine tests, front-end type check, unit tests and end-to-end tests (the desktop UI against
# `quire serve`, and the web version with its WebAssembly engine) on every push.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          # the web version's engine (crates/quire-web), built for the e2e tests of the web version
          targets: wasm32-unknown-unknown
      - uses: swatinem/rust-cache@v2
      - name: Engine tests
        run: cargo test --workspace --exclude quire-app
      - name: Lint
        run: |
          cargo fmt --all --check
          cargo clippy --workspace --exclude quire-app --all-targets -- -D warnings
          cargo clippy -p quire-web --target wasm32-unknown-unknown -- -D warnings
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Front-end type check
        run: npm ci && npx tsc --noEmit
        working-directory: app
      - name: Front-end unit tests
        run: npm test
        working-directory: app
      - name: End-to-end smoke test (WebKit)
        run: |
          npx playwright install --with-deps webkit
          npm run e2e
        working-directory: app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: app/test-results/
          if-no-files-found: ignore
