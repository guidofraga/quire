[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]

[workspace.package]
version = "0.1.11"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
quire-ast = { path = "crates/quire-ast" }
quire-units = { path = "crates/quire-units" }
quire-eval = { path = "crates/quire-eval" }
quire-doc = { path = "crates/quire-doc" }
quire-service = { path = "crates/quire-service" }
quire-cli = { path = "crates/quire-cli" }
quire-web = { path = "crates/quire-web" }
quire-smath = { path = "crates/quire-smath" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# no panics in the code: every failure is an error value the caller handles
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"

# the browser engine (crates/quire-web): small to download, still fast
[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
